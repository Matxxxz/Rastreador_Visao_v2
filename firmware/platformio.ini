; =============================================================================
; Vision Tracker V2 — Firmware ESP32
; Autor: Mateus Augusto Guimarães | Engenharia de Computação - UFG
; =============================================================================
;
; PLATAFORMA: pioarduino com Core 3.x (versão fixa para builds reprodutíveis)
; Tag fixada: 55.03.312-1 (Arduino ESP32 Core 3.3.1x / ESP-IDF 5.5.x)
; =============================================================================

[platformio]
default_envs = esp32dev

[env]
board = esp32dev
framework = arduino
monitor_speed = 115200
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8

; --- Ambiente 1: Simulação Wokwi (padrão) ---
; Rede Wokwi-GUEST, HiveMQ público, sem TLS.
[env:esp32dev]
build_flags =
    -DWOKWI_SIMULATION

; --- Ambiente 2: Desenvolvimento Local ---
; Broker Mosquitto local na LAN, sem TLS para iteração rápida.
; Requer firmware/include/secrets.h (veja secrets.example.h).
[env:esp32local]
build_flags =
    -DLOCAL_DEV

; --- Ambiente 3: Produção / Hardware Real ---
; TLS obrigatório (porta 8883) + autenticação por usuário/senha.
; Requer firmware/include/secrets.h e firmware/include/ca_cert.h.
[env:esp32prod]
build_flags =
    -DPRODUCTION
