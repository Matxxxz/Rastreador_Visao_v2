; =============================================================================
; Vision Tracker V2 — Firmware ESP32
; Autor: Mateus Augusto Guimarães | Engenharia de Computação - UFG
; =============================================================================
;
; PLATAFORMA: pioarduino (fork community do espressif32 com suporte ao Core 3.x)
; -----------
; O código usa a API ledc do Arduino ESP32 Core 3.x:
;   ledcAttach(pin, freq, resolution)  — sem canal explícito
;   ledcWrite(pin, duty)               — opera sobre o pino diretamente
;
; Por que pioarduino e não espressif32 @ 6.x?
;   A plataforma oficial empacota o Core 2.0.x com "platformio-build.py".
;   O Core 3.x distribui "pioarduino-build.py" — builders incompatíveis por design.
;   Misturá-los via platform_packages gera: "missing SConscript: platformio-build.py".
;   O pioarduino é a plataforma completa e coesa que resolve isso corretamente.
;
; Tag usada: 55.03.312-1 (2026-09-22) — última release estável confirmada via GitHub API
;   55     → ESP-IDF 5.5.x
;   03.31  → Arduino ESP32 Core 3.3.1x
;   O alias "stable" abaixo sempre aponta para o último release estável automaticamente.
; =============================================================================

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8.0
